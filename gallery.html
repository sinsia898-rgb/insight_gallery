<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>인사이트 보관함 — 모아보기</title>
<link rel="stylesheet" href="https://spoqa.github.io/spoqa-han-sans/css/SpoqaHanSansNeo.css">
<style>
  :root{
    --paper:#F6F3EE;
    --ink:#232019;
    --ink-soft:#6B6459;
    --clay:#9C5B3C;
    --clay-soft:#F0E0D5;
    --line:#E4DED4;
    --white:#FFFFFF;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:"Spoqa Han Sans Neo","Spoqa Han Sans","Apple SD Gothic Neo",sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  header{
    padding:28px 20px 18px;
    border-bottom:1px solid var(--line);
  }
  .eyebrow{
    font-size:12px;font-weight:700;letter-spacing:.08em;
    color:var(--clay);text-transform:uppercase;margin:0 0 6px;
  }
  h1{font-size:22px;font-weight:700;margin:0;letter-spacing:-.01em;}
  nav{display:flex;gap:8px;padding:14px 20px 0;}
  nav a{
    flex:1;text-align:center;padding:10px 0;border-radius:999px;
    font-size:13px;font-weight:700;text-decoration:none;
    border:1px solid var(--line);color:var(--ink-soft);background:var(--white);
  }
  nav a.active{background:var(--ink);color:var(--white);border-color:var(--ink);}

  .filters{
    position:sticky;top:0;
    background:var(--paper);
    z-index:5;
    padding:16px 20px;
    display:flex;
    gap:8px;
    overflow-x:auto;
    border-bottom:1px solid var(--line);
  }
  .filters::-webkit-scrollbar{display:none;}
  .pill{
    flex:0 0 auto;
    padding:8px 14px;
    border-radius:999px;
    border:1px solid var(--line);
    background:var(--white);
    font-size:13px;font-weight:600;color:var(--ink);
    cursor:pointer;white-space:nowrap;
  }
  .pill.selected{background:var(--ink);border-color:var(--ink);color:var(--white);}

  .grid{
    padding:16px 20px 60px;
    columns:2;
    column-gap:12px;
  }
  @media (min-width:640px){ .grid{columns:3;} }
  @media (min-width:960px){ .grid{columns:4;} }

  .card{
    break-inside:avoid;
    margin-bottom:12px;
    background:var(--white);
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden;
    cursor:pointer;
    position:relative;
  }
  .card img{
    width:100%;
    display:block;
    background:#eee;
  }
  .flag{
    position:absolute;
    top:8px;left:8px;
    background:var(--clay);
    color:var(--white);
    font-size:10px;
    font-weight:700;
    padding:3px 8px;
    border-radius:999px;
  }
  .card .meta{
    padding:8px 10px 10px;
  }
  .card .comment{
    font-size:12.5px;
    line-height:1.4;
    color:var(--ink);
    margin:0 0 4px;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }
  .card .who{
    font-size:11px;
    color:var(--ink-soft);
  }

  .empty, .loading{
    padding:60px 20px;
    text-align:center;
    color:var(--ink-soft);
    font-size:13px;
  }

  .modal-backdrop{
    position:fixed;inset:0;
    background:rgba(20,18,15,.72);
    display:none;
    align-items:center;justify-content:center;
    padding:20px;
    z-index:20;
  }
  .modal-backdrop.show{display:flex;}
  .modal{
    background:var(--white);
    border-radius:16px;
    max-width:480px;
    width:100%;
    max-height:88vh;
    overflow:auto;
  }
  .modal img{width:100%;display:block;background:#111;}
  .modal .body{padding:18px 20px 20px;}
  .modal .tag{
    display:inline-block;
    background:var(--clay-soft);
    color:var(--clay);
    font-size:11px;font-weight:700;
    padding:4px 10px;border-radius:999px;
    margin-bottom:10px;
  }
  .modal .comment{font-size:14.5px;line-height:1.6;margin:0 0 12px;}
  .modal .who{font-size:12px;color:var(--ink-soft);}
  .modal .close{
    position:sticky;top:10px;left:calc(100% - 44px);
    width:32px;height:32px;
    border-radius:50%;
    background:rgba(0,0,0,.45);
    color:#fff;
    border:none;
    font-size:16px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    margin:10px;
  }
</style>
</head>
<body>

<header>
  <p class="eyebrow">Insight Archive</p>
  <h1>인사이트 보관함</h1>
</header>

<nav>
  <a href="index.html">올리기</a>
  <a href="gallery.html" class="active">모아보기</a>
</nav>

<div class="filters" id="filters"></div>
<div id="content"><div class="loading">불러오는 중…</div></div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" id="modal"></div>
</div>

<script>
// ⚠️ Apps Script 배포 후 발급된 "웹 앱 URL"을 여기에 붙여넣으세요.
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby7KyGo6rkOYwBTYQB83WKisT9Zw6uKoLb_RfIX1_n5Jt6bAoSFomNVGfH9GnTJwqOX4Q/exec";

const filtersEl = document.getElementById('filters');
const contentEl = document.getElementById('content');
const modalBackdrop = document.getElementById('modalBackdrop');
const modal = document.getElementById('modal');

let allItems = [];
let activeCategory = '전체';

async function load() {
  try {
    const [listRes, catRes] = await Promise.all([
      fetch(`${APPS_SCRIPT_URL}?action=list`),
      fetch(`${APPS_SCRIPT_URL}?action=categories`)
    ]);
    const listData = await listRes.json();
    const catData = await catRes.json();
    allItems = listData.ok ? listData.items : [];
    renderFilters(catData.ok ? catData.categories : []);
    renderGrid();
  } catch (err) {
    contentEl.innerHTML = '<div class="empty">불러오지 못했어요. 새로고침해보세요.</div>';
  }
}

function renderFilters(categories) {
  const all = ['전체', ...categories];
  filtersEl.innerHTML = '';
  all.forEach((name) => {
    const pill = document.createElement('div');
    pill.className = 'pill' + (name === activeCategory ? ' selected' : '');
    pill.textContent = name;
    pill.addEventListener('click', () => {
      activeCategory = name;
      [...filtersEl.children].forEach(c => c.classList.remove('selected'));
      pill.classList.add('selected');
      renderGrid();
    });
    filtersEl.appendChild(pill);
  });
}

function renderGrid() {
  const items = activeCategory === '전체'
    ? allItems
    : allItems.filter(it => it.category === activeCategory);

  if (items.length === 0) {
    contentEl.innerHTML = '<div class="empty">아직 쌓인 인사이트가 없어요. 첫 캡쳐를 올려보세요.</div>';
    return;
  }

  const grid = document.createElement('div');
  grid.className = 'grid';
  items.forEach((it) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <span class="flag">${escapeHtml(it.category)}</span>
      <img src="${it.imageUrl}" loading="lazy">
      <div class="meta">
        <p class="comment">${escapeHtml(it.comment || '')}</p>
        <div class="who">${escapeHtml(it.submitter)} · ${formatDate(it.date)}</div>
      </div>
    `;
    card.addEventListener('click', () => openModal(it));
    grid.appendChild(card);
  });

  contentEl.innerHTML = '';
  contentEl.appendChild(grid);
}

function openModal(it) {
  modal.innerHTML = `
    <button class="close" id="closeBtn">✕</button>
    <img src="${it.imageUrl}">
    <div class="body">
      <span class="tag">${escapeHtml(it.category)}</span>
      <p class="comment">${escapeHtml(it.comment || '(한줄평 없음)')}</p>
      <div class="who">${escapeHtml(it.submitter)} · ${formatDate(it.date)}</div>
    </div>
  `;
  modalBackdrop.classList.add('show');
  document.getElementById('closeBtn').addEventListener('click', closeModal);
}

function closeModal() {
  modalBackdrop.classList.remove('show');
}

modalBackdrop.addEventListener('click', (e) => {
  if (e.target === modalBackdrop) closeModal();
});

function formatDate(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return '';
  return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

load();
</script>
</body>
</html>
