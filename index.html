<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16181D">
<title>인사이트 보관함</title>
<link href="https://spoqa.github.io/spoqa-han-sans/css/SpoqaHanSansNeo.css" rel="stylesheet">
<style>
  :root{
    --ink:#16181D;
    --ink-60:#5B6069;
    --ink-30:#9AA0A8;
    --line:#DFE2E6;
    --surface:#FFFFFF;
    --bg:#EDEEF0;
    --accent:#2B4CFF;
    --accent-soft:#E8ECFF;
    --danger:#C2352B;
    --r:14px;
    --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:'Spoqa Han Sans Neo',-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;
    background:var(--bg); color:var(--ink);
    font-size:15px; line-height:1.55;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .wrap{max-width:720px;margin:0 auto;padding:0 16px 64px}

  /* ── 헤더 ───────────────────────── */
  header{
    position:sticky;top:0;z-index:20;
    background:var(--bg);
    padding:18px 16px 10px;
    max-width:720px;margin:0 auto;
  }
  h1{
    margin:0 0 14px;
    font-size:20px;font-weight:700;letter-spacing:-.03em;
  }
  h1 span{color:var(--ink-30);font-weight:400}
  .tabs{display:flex;gap:4px;background:#E1E3E6;padding:4px;border-radius:11px}
  .tabs button{
    flex:1;border:0;background:transparent;cursor:pointer;
    font:inherit;font-weight:600;font-size:14px;color:var(--ink-60);
    padding:9px 0;border-radius:8px;transition:.15s;
  }
  .tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}

  /* ── 폼 ─────────────────────────── */
  .card{background:var(--surface);border-radius:var(--r);padding:18px;margin-top:14px}
  label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-60);margin-bottom:8px;letter-spacing:.01em}
  input[type=text],textarea{
    width:100%;font:inherit;color:var(--ink);
    border:1.5px solid var(--line);border-radius:10px;
    padding:11px 12px;background:var(--surface);
    transition:border-color .15s;
  }
  input[type=text]:focus,textarea:focus{outline:0;border-color:var(--accent)}
  textarea{resize:vertical;min-height:76px}
  .field + .field{margin-top:18px}

  .drop{
    border:1.5px dashed var(--line);border-radius:12px;
    padding:28px 16px;text-align:center;cursor:pointer;
    color:var(--ink-60);font-size:14px;transition:.15s;
  }
  .drop:active{border-color:var(--accent);background:var(--accent-soft)}
  .drop strong{display:block;color:var(--ink);font-size:15px;margin-bottom:3px}
  .preview{position:relative;border-radius:12px;overflow:hidden;background:#000;display:none}
  .preview img{display:block;width:100%;max-height:340px;object-fit:contain}
  .preview button{
    position:absolute;top:8px;right:8px;
    border:0;border-radius:8px;padding:7px 11px;cursor:pointer;
    font:inherit;font-size:12.5px;font-weight:600;
    background:rgba(0,0,0,.65);color:#fff;backdrop-filter:blur(6px);
  }

  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{
    border:1.5px solid var(--line);background:var(--surface);
    border-radius:999px;padding:8px 14px;cursor:pointer;
    font:inherit;font-size:13.5px;font-weight:600;color:var(--ink-60);
    transition:.15s;
  }
  .chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}

  .submit{
    width:100%;margin-top:20px;border:0;border-radius:11px;cursor:pointer;
    background:var(--accent);color:#fff;font:inherit;font-weight:700;font-size:15px;
    padding:15px 0;transition:.15s;
  }
  .submit:disabled{background:var(--ink-30);cursor:default}

  .msg{margin-top:12px;font-size:13.5px;font-weight:600;text-align:center;min-height:20px}
  .msg.ok{color:var(--accent)}
  .msg.err{color:var(--danger)}

  /* ── 갤러리 ─────────────────────── */
  .filters{margin:14px 0 0;display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
  .filters::-webkit-scrollbar{display:none}
  .filters .chip{flex:0 0 auto}

  .grid{margin-top:14px;display:grid;gap:12px;grid-template-columns:1fr}
  @media(min-width:560px){.grid{grid-template-columns:1fr 1fr}}

  .item{background:var(--surface);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
  .item .thumb{width:100%;aspect-ratio:4/3;object-fit:cover;background:#E1E3E6;cursor:zoom-in;display:block}
  .item .body{padding:13px 14px 14px}
  .item .note{font-size:14.5px;font-weight:500;letter-spacing:-.01em;margin:0 0 9px;white-space:pre-wrap}
  .item .note.empty{color:var(--ink-30);font-weight:400}
  .item .meta{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ink-30);font-family:var(--mono)}
  .item .cat{
    font-family:'Spoqa Han Sans Neo',sans-serif;font-size:11.5px;font-weight:700;
    color:var(--accent);background:var(--accent-soft);
    padding:3px 8px;border-radius:6px;letter-spacing:0;
  }

  .state{text-align:center;color:var(--ink-30);padding:56px 20px;font-size:14px}
  .state strong{display:block;color:var(--ink-60);font-size:15px;margin-bottom:5px}

  /* ── 라이트박스 ─────────────────── */
  .lb{
    position:fixed;inset:0;z-index:60;background:rgba(10,11,13,.94);
    display:none;align-items:center;justify-content:center;padding:20px;
  }
  .lb.on{display:flex}
  .lb img{max-width:100%;max-height:88vh;object-fit:contain;border-radius:8px}

  .hidden{display:none}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <h1>인사이트 보관함 <span>· 시스디자인</span></h1>
  <div class="tabs" role="tablist">
    <button role="tab" id="tab-add" aria-selected="true">올리기</button>
    <button role="tab" id="tab-list" aria-selected="false">모아보기</button>
  </div>
</header>

<div class="wrap">

  <!-- 올리기 -->
  <section id="view-add">
    <div class="card">
      <div class="field">
        <label for="img">캡쳐 이미지</label>
        <div class="drop" id="drop">
          <strong>이미지 고르기</strong>
          사진첩에서 방금 캡쳐한 화면을 선택하세요
        </div>
        <div class="preview" id="preview">
          <img id="previewImg" alt="선택한 이미지 미리보기">
          <button type="button" id="clearImg">다시 고르기</button>
        </div>
        <input type="file" id="img" accept="image/*" class="hidden">
      </div>

      <div class="field">
        <label>카테고리</label>
        <div class="chips" id="catChips"></div>
      </div>

      <div class="field">
        <label for="note">어떤 점이 좋았나요</label>
        <textarea id="note" placeholder="여백을 크게 쓴 레이아웃. 제품 컷이 하나뿐인데도 꽉 차 보임"></textarea>
      </div>

      <div class="field">
        <label for="author">올린 사람</label>
        <input type="text" id="author" placeholder="이름" autocomplete="name">
      </div>

      <button class="submit" id="submit">보관함에 올리기</button>
      <div class="msg" id="msg"></div>
    </div>
  </section>

  <!-- 모아보기 -->
  <section id="view-list" class="hidden">
    <div class="filters" id="filters"></div>
    <div class="grid" id="grid"></div>
    <div class="state" id="listState"><strong>불러오는 중</strong>잠시만 기다려 주세요</div>
  </section>

</div>

<div class="lb" id="lb"><img id="lbImg" alt="원본 이미지"></div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbxqDorIHOUYqkQCLuQWuUn0Y7Aym-4wG2QTvPc8aMOYBZIaTVt_NGwJW7WAqtci1kkS/exec';

const $ = s => document.querySelector(s);
let categories = [], picked = '', imageB64 = null, listLoaded = false, filter = '전체';

/* 이름 기억 (실패해도 무시) */
const remember = {
  get(){ try { return localStorage.getItem('insight_author') || ''; } catch(e){ return ''; } },
  set(v){ try { localStorage.setItem('insight_author', v); } catch(e){} }
};

/* ── 탭 ─────────────────────────── */
$('#tab-add').onclick  = () => switchTab('add');
$('#tab-list').onclick = () => switchTab('list');

function switchTab(which){
  const isAdd = which === 'add';
  $('#tab-add').setAttribute('aria-selected', isAdd);
  $('#tab-list').setAttribute('aria-selected', !isAdd);
  $('#view-add').classList.toggle('hidden', !isAdd);
  $('#view-list').classList.toggle('hidden', isAdd);
  if (!isAdd && !listLoaded) loadList();
}

/* ── 카테고리 ───────────────────── */
async function loadCategories(){
  try {
    const r = await fetch(API + '?action=categories');
    const d = await r.json();
    categories = d.categories || [];
  } catch(e){
    categories = ['광고소재','디자인','콘텐츠','기타'];
  }
  picked = categories[0] || '';
  renderCatChips();
  renderFilters();
}

function renderCatChips(){
  $('#catChips').innerHTML = '';
  categories.forEach(c => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'chip'; b.textContent = c;
    b.setAttribute('aria-pressed', c === picked);
    b.onclick = () => { picked = c; renderCatChips(); };
    $('#catChips').appendChild(b);
  });
}

function renderFilters(){
  const all = ['전체', ...categories];
  $('#filters').innerHTML = '';
  all.forEach(c => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'chip'; b.textContent = c;
    b.setAttribute('aria-pressed', c === filter);
    b.onclick = () => { filter = c; renderFilters(); renderGrid(); };
    $('#filters').appendChild(b);
  });
}

/* ── 이미지 선택 + 축소 ─────────── */
$('#drop').onclick = () => $('#img').click();
$('#clearImg').onclick = () => resetImage();

$('#img').onchange = e => {
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  shrink(f).then(({dataUrl, b64}) => {
    imageB64 = b64;
    $('#previewImg').src = dataUrl;
    $('#preview').style.display = 'block';
    $('#drop').style.display = 'none';
  }).catch(() => say('이미지를 읽지 못했습니다. 다른 파일로 시도해 주세요.', 'err'));
};

function resetImage(){
  imageB64 = null;
  $('#img').value = '';
  $('#preview').style.display = 'none';
  $('#drop').style.display = 'block';
}

function shrink(file, max = 1400){
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = rej;
    fr.onload = () => {
      const im = new Image();
      im.onerror = rej;
      im.onload = () => {
        const scale = Math.min(1, max / Math.max(im.width, im.height));
        const cv = document.createElement('canvas');
        cv.width  = Math.round(im.width  * scale);
        cv.height = Math.round(im.height * scale);
        cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height);
        const dataUrl = cv.toDataURL('image/jpeg', 0.82);
        res({ dataUrl, b64: dataUrl.split(',')[1] });
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* ── 제출 ───────────────────────── */
$('#submit').onclick = async () => {
  const author = $('#author').value.trim();
  const note   = $('#note').value.trim();

  if (!imageB64) return say('이미지를 먼저 골라 주세요.', 'err');
  if (!picked)   return say('카테고리를 골라 주세요.', 'err');
  if (!author)   return say('올린 사람 이름을 넣어 주세요.', 'err');

  $('#submit').disabled = true;
  $('#submit').textContent = '올리는 중…';
  say('');

  try {
    const r = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action:'submit', author, category:picked, note, imageB64, mimeType:'image/jpeg' })
    });
    const d = await r.json();
    if (!d.ok) throw new Error(d.error || '저장에 실패했습니다.');

    remember.set(author);
    resetImage();
    $('#note').value = '';
    listLoaded = false;
    say('올렸습니다. 모아보기에서 확인할 수 있습니다.', 'ok');
  } catch(err){
    say(String(err.message || err), 'err');
  } finally {
    $('#submit').disabled = false;
    $('#submit').textContent = '보관함에 올리기';
  }
};

function say(text, kind){
  const m = $('#msg');
  m.textContent = text || '';
  m.className = 'msg' + (kind ? ' ' + kind : '');
}

/* ── 목록 ───────────────────────── */
let items = [];

async function loadList(){
  $('#grid').innerHTML = '';
  $('#listState').style.display = 'block';
  $('#listState').innerHTML = '<strong>불러오는 중</strong>잠시만 기다려 주세요';
  try {
    const r = await fetch(API + '?action=list');
    const d = await r.json();
    if (!d.ok) throw new Error(d.error);
    items = d.items || [];
    listLoaded = true;
    renderGrid();
  } catch(e){
    $('#listState').innerHTML = '<strong>불러오지 못했습니다</strong>새로고침해 주세요';
  }
}

function renderGrid(){
  const rows = items.filter(o => filter === '전체' || o.category === filter);
  const grid = $('#grid');
  grid.innerHTML = '';

  if (!rows.length){
    $('#listState').style.display = 'block';
    $('#listState').innerHTML = items.length
      ? '<strong>이 카테고리는 아직 비어 있습니다</strong>다른 카테고리를 보거나 하나 올려보세요'
      : '<strong>아직 올린 레퍼런스가 없습니다</strong>올리기 탭에서 첫 캡쳐를 넣어보세요';
    return;
  }
  $('#listState').style.display = 'none';

  rows.forEach(o => {
    const el = document.createElement('article');
    el.className = 'item';

    const img = document.createElement('img');
    img.className = 'thumb'; img.loading = 'lazy';
    img.src = o.imageUrl; img.alt = o.note || '레퍼런스 이미지';
    img.onclick = () => openLb(o.imageUrl);

    const body = document.createElement('div');
    body.className = 'body';

    const note = document.createElement('p');
    note.className = 'note' + (o.note ? '' : ' empty');
    note.textContent = o.note || '한줄평 없음';

    const meta = document.createElement('div');
    meta.className = 'meta';
    const cat = document.createElement('span');
    cat.className = 'cat'; cat.textContent = o.category;
    meta.appendChild(cat);
    meta.appendChild(document.createTextNode(o.date + ' · ' + o.author));

    body.appendChild(note); body.appendChild(meta);
    el.appendChild(img); el.appendChild(body);
    grid.appendChild(el);
  });
}

/* ── 라이트박스 ─────────────────── */
function openLb(url){ $('#lbImg').src = url; $('#lb').classList.add('on'); }
$('#lb').onclick = () => $('#lb').classList.remove('on');
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('#lb').classList.remove('on'); });

/* ── 시작 ───────────────────────── */
$('#author').value = remember.get();
loadCategories();
</script>
</body>
</html>
